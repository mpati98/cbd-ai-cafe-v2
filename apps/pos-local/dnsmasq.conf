# Template dnsmasq — resolve dalat.cbdaicafe.com về IP LAN của PC chạy
# pos-local, để khách trên WiFi quán vào đúng container qua HTTPS.
# Không dùng trực tiếp — copy thành /etc/dnsmasq.conf (hoặc file trong
# /etc/dnsmasq.d/) trên PC, thay <LAN_IP_CUA_PC>, rồi restart dnsmasq.
# Xem README.md phần "dnsmasq trên PC" để biết cách tìm LAN IP + trỏ DHCP
# của router về PC này.

address=/dalat.cbdaicafe.com/192.168.1.200

# Vẫn cho các domain khác resolve bình thường qua DNS upstream — đổi IP dưới
# đây thành DNS mà router quán đang dùng (thường là 8.8.8.8 hoặc DNS của ISP).
server=8.8.8.8
server=1.1.1.1
